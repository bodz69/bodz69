<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.52" stop-color="#0B1530"/>
      <stop offset="1" stop-color="#10112B"/>
    </linearGradient>
    <linearGradient id="accent" x1="120" y1="80" x2="1030" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.52" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" stroke="#78DDF0" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="360" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="360" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <circle cx="1050" cy="40" r="220" fill="#7C3AED" fill-opacity="0.08"/>
    <circle cx="980" cy="320" r="260" fill="#22D3EE" fill-opacity="0.07"/>
    <path d="M0 305C180 255 330 360 520 310C710 260 830 295 1200 215V360H0V305Z" fill="#0EA5E9" fill-opacity="0.045"/>

    <!-- Accent rail -->
    <rect x="76" y="67" width="8" height="224" rx="4" fill="url(#accent)" filter="url(#glow)"/>

    <!-- Category chips -->
    <g font-family="Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5">
      <rect x="116" y="68" width="112" height="34" rx="17" fill="url(#glass)" stroke="#22D3EE" stroke-opacity="0.35"/>
      <text x="172" y="90" fill="#A5F3FC" text-anchor="middle">ROBOTICS</text>

      <rect x="240" y="68" width="126" height="34" rx="17" fill="url(#glass)" stroke="#60A5FA" stroke-opacity="0.35"/>
      <text x="303" y="90" fill="#BFDBFE" text-anchor="middle">EMBEDDED</text>

      <rect x="378" y="68" width="76" height="34" rx="17" fill="url(#glass)" stroke="#A78BFA" stroke-opacity="0.35"/>
      <text x="416" y="90" fill="#DDD6FE" text-anchor="middle">AI</text>
    </g>

    <!-- Main copy -->
    <text x="114" y="178" fill="white" font-family="Segoe UI, Arial, sans-serif" font-size="78" font-weight="800" letter-spacing="5">BODZ69</text>
    <rect x="116" y="199" width="490" height="3" rx="1.5" fill="url(#accent)" opacity="0.9"/>
    <text x="116" y="242" fill="#D7E5F4" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="600">
      Robotics &amp; Embedded Systems Developer
    </text>
    <text x="116" y="278" fill="#8EA4BC" font-family="Segoe UI, Arial, sans-serif" font-size="17">
      From simulation and algorithms to physical intelligent machines
    </text>

    <!-- Abstract AGV / robot system -->
    <g transform="translate(735 54)">
      <rect x="0" y="0" width="380" height="252" rx="26" fill="url(#glass)" stroke="#78DDF0" stroke-opacity="0.18"/>
      <path d="M40 56H128L162 92H260" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="2"/>
      <circle cx="40" cy="56" r="5" fill="#22D3EE" filter="url(#glow)"/>
      <circle cx="260" cy="92" r="5" fill="#8B5CF6" filter="url(#glow)"/>

      <!-- Robot arm -->
      <g transform="translate(55 62)" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="60" cy="126" r="18" fill="#0F1C36" stroke="#22D3EE" stroke-width="3"/>
        <path d="M60 108L105 66" stroke="url(#accent)" stroke-width="13"/>
        <circle cx="108" cy="63" r="14" fill="#0F1C36" stroke="#60A5FA" stroke-width="3"/>
        <path d="M120 55L164 35" stroke="url(#accent)" stroke-width="12"/>
        <circle cx="169" cy="32" r="11" fill="#0F1C36" stroke="#A78BFA" stroke-width="3"/>
        <path d="M178 26L200 12" stroke="#A78BFA" stroke-width="8"/>
        <path d="M199 12L214 4M199 12L216 20" stroke="#C4B5FD" stroke-width="4"/>
        <rect x="25" y="143" width="98" height="22" rx="8" fill="#111E38" stroke="#22D3EE" stroke-opacity="0.65"/>
      </g>

      <!-- AGV -->
      <g transform="translate(210 128)">
        <path d="M4 42L24 12H116L138 42V78H4V42Z" fill="#111E38" stroke="#60A5FA" stroke-width="2.5"/>
        <rect x="40" y="24" width="57" height="21" rx="5" fill="#22D3EE" fill-opacity="0.16" stroke="#22D3EE" stroke-opacity="0.75"/>
        <circle cx="31" cy="80" r="15" fill="#070B18" stroke="#22D3EE" stroke-width="3"/>
        <circle cx="111" cy="80" r="15" fill="#070B18" stroke="#8B5CF6" stroke-width="3"/>
        <circle cx="70" cy="7" r="5" fill="#22D3EE" filter="url(#glow)"/>
        <path d="M70 7V23" stroke="#22D3EE" stroke-width="2"/>
      </g>

      <!-- Data packets -->
      <g fill="#22D3EE">
        <circle cx="321" cy="47" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/></circle>
        <circle cx="339" cy="47" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.3s" repeatCount="indefinite"/></circle>
        <circle cx="357" cy="47" r="3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="0.6s" repeatCount="indefinite"/></circle>
      </g>
      <text x="316" y="74" fill="#72869C" font-family="Consolas, monospace" font-size="11">SENSE · PLAN · ACT</text>
    </g>
  </g>
</svg>
